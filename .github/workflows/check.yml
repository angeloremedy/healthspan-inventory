name: check
# Every push and PR: the test suites, the production build, and the manual coverage
# check. No Claude here — this is the ground the agent loop will later stand on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: TZ=Asia/Manila npm test
      - name: Build smoke
        run: |
          npm run build
          node --check dist/app.*.js
          echo "bundle $(ls dist/app.*.js) $(du -h dist/app.*.js | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Manual coverage (every allowed page is documented)
        run: node tools/manuals/coverage.js | tee -a "$GITHUB_STEP_SUMMARY"
